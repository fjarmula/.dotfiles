"$schema" = "https://starship.rs/config-schema.json"

add_newline = false

format = """
$os\
$username\
[\uE0B0](bg:215 fg:red)\
$directory\
[\uE0B0](bg:yellow fg:215)\
$git_branch\
$git_status\
[\uE0B0](bg:blue fg:yellow)\
$python\
[\uE0B4](fg:blue)\
$character"""

# =========================
# OS
# =========================

[os]
disabled = false
style = "bg:red fg:0"
format = "[ $symbol]($style)"

[os.symbols]
Macos = "\U000F0035 "

# =========================
# Username
# =========================

[username]
show_always = true
style_user = "bg:red fg:0 bold"
style_root = "bg:red fg:0 bold"
format = "[$user ]($style)"

# =========================
# Directory
# =========================

[directory]
style = "bg:215 fg:0 bold"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "\u2026/"

# =========================
# Git
# =========================

[git_branch]
symbol = "\uF418 "
style = "bg:yellow fg:0 bold"
format = "[ $symbol$branch]($style)"

[git_status]
stashed = ""
untracked = ""
style = "bg:yellow fg:0 bold"
format = "[$all_status$ahead_behind ]($style)"

# =========================
# Python
# =========================

[python]
style = "bg:blue fg:0 bold"
format = "[ $virtualenv ]($style)"

# =========================
# Prompt character
# =========================

[character]
disabled = false
success_symbol = ""
error_symbol = ""
vimcmd_symbol = ""